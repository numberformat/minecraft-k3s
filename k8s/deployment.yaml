apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-${INSTANCE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: minecraft-paper
    app.kubernetes.io/instance: ${INSTANCE_NAME}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft-paper
      app.kubernetes.io/instance: ${INSTANCE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft-paper
        app.kubernetes.io/instance: ${INSTANCE_NAME}
    spec:
      nodeSelector:
        "${NODE_LABEL}": "true"
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "${TYPE}"
            - name: VERSION
              value: "${VERSION}"
            - name: MEMORY
              value: "${MEMORY}"
            - name: ENABLE_RCON
              value: "${ENABLE_RCON}"
            - name: MOTD
              value: "${SERVER_NAME}"
            - name: SERVER_NAME
              value: "${SERVER_NAME}"
            - name: MODE
              value: "${MODE}"
            - name: DIFFICULTY
              value: "${DIFFICULTY}"
            - name: LEVEL
              value: "${LEVEL}"
            - name: SEED
              value: "${SEED}"
            - name: MAX_PLAYERS
              value: "${MAX_PLAYERS}"
            - name: PLAYER_IDLE_TIMEOUT
              value: "${PLAYER_IDLE_TIMEOUT}"
            - name: VIEW_DISTANCE
              value: "${VIEW_DISTANCE}"
            - name: SIMULATION_DISTANCE
              value: "${SIMULATION_DISTANCE}"
            # Floodgate relies on the Java server accepting non-Mojang-authenticated
            # Bedrock identities that Geyser translates into Java sessions.
            - name: ONLINE_MODE
              value: "${ONLINE_MODE}"
            - name: PVP
              value: "${PVP}"
            - name: ENABLE_WHITELIST
              value: "${ENABLE_WHITELIST}"
            - name: PLUGINS
              value: |
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
                https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
                https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.9.0/PAPER/ViaVersion-5.9.0.jar
                https://hangarcdn.papermc.io/plugins/ViaVersion/ViaBackwards/versions/5.9.0/PAPER/ViaBackwards-5.9.0.jar
          ports:
            - name: java
              containerPort: 25565
              protocol: TCP
            # Geyser listens on UDP 19132 for Bedrock clients even though the actual
            # Minecraft server is Java/Paper. This port must remain exposed for cross-play.
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - 127.0.0.1
                - --port
                - "25565"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - 127.0.0.1
                - --port
                - "25565"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-${INSTANCE_NAME}-data
